    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
$(document).ready(function() {
    const urlParams = new URLSearchParams(window.location.search);
    const searchTerm = urlParams.get('query');
    const dbsnp = urlParams.get('dbsnp');
    const phenotypeTrait = urlParams.get('PhenotypeTrait');

    $('title').text(`Details for ${searchTerm}`);
    $('#selectedSearchTerm').text(searchTerm);

    // Show loading indicator
    $('#loadingIndicator').show();

 $.getJSON('http://localhost/details.php', { query: dbsnp, column: 'DBSNP id' }, function(data) {
    console.log("Fetched data:", data);
    
    let $topColumnsContainer = $('#topColumnsContainer');
    let $detailedContainer = $('#detailedResultsContainer');
    $topColumnsContainer.empty();
    $detailedContainer.empty();

    if (data && data.length > 0) {
        let phenotypes = phenotypeTrait.split(',').map(p => p.trim());
        console.log("Phenotypes to filter:", phenotypes);
        
        let filteredData = data.filter(record => {
            return phenotypes.includes(record['Phenotype/Trait']);
        });

        console.log("Filtered data:", filteredData);
        $('#resultCount').text(filteredData.length); 
        if (filteredData.length > 0) {
            let recordsByPMID = {};
            filteredData.forEach(record => {
                let pmid = record['PMID'];
                if (!recordsByPMID[pmid]) {
                    recordsByPMID[pmid] = [];
                }
                recordsByPMID[pmid].push(record);
            });

            let counter = 0;
            Object.keys(recordsByPMID).forEach((pmid, index) => {
                let records = recordsByPMID[pmid];

                fetchPublicationTitle(pmid, function(title) {
                    let $recordBox = $('<div></div>').addClass('record-box');
                    let pubMedLink = `https://pubmed.ncbi.nlm.nih.gov/${pmid}`;
                    let $pubMedLink = $('<a></a>').addClass('pmid-link').attr('href', pubMedLink).attr('target', '_blank').text(`PMID: ${pmid}`);
                    $recordBox.append($pubMedLink);

                    $recordBox.prepend(`<div class="publication-title">${counter + 1}. From Publication: ${title}</div>`);

                    let phenotypes = {};
                    records.forEach(record => {
                        let phenotype = record['Phenotype/Trait'];
                        if (!phenotypes[phenotype]) {
                            phenotypes[phenotype] = [];
                        }
                        phenotypes[phenotype].push(record);
                    });

                    if (index === 0) {
                        appendTopColumns($topColumnsContainer, records[0]);
                    }

                    Object.keys(phenotypes).forEach((phenotype, idx) => {
                        $recordBox.append(`<div class="phenotype-category-title">Phenotype/Trait: ${phenotype}</div>`);
                        $recordBox.append('<div class="study-parameters-title">Study Parameters</div><div class="study-parameters-divider"></div>');
                        appendStudyParameters($recordBox, phenotypes[phenotype]);
                    });

                    $detailedContainer.append($recordBox);
                    counter++;
                });
            });
        } else {
            $detailedContainer.append('<p>No results found.</p>');
        }
    } else {
        $detailedContainer.append('<p>No results found.</p>');
    }
});

function appendTopColumns($container, record) {
    const topColumns = ['DBSNP id', 'G Build', 'Chromosome number', 'Start Position', 'End Position', 'Variant', 'Reference ', 'Alternate', 'Gene', 'Gene Function', 'Other Function', 'Genomic Location', 'Amino Acid Change'];
    const $topColumnsGrid = $('<div></div>').addClass('top-columns-grid top-columns-container');

    topColumns.forEach(key => {
        if (record.hasOwnProperty(key)) {
            let $recordDetail = $('<div></div>').addClass('record-detail');
            let $recordKey = $('<div></div>').addClass('record-key').text(key + ':');
            let $recordValue = $('<div></div>').addClass('record-value');

            if (key === 'DBSNP id') {
                let dbsnpId = record[key];
                let nihLink = `https://www.ncbi.nlm.nih.gov/snp/${dbsnpId}`;
                let $nihLink = $('<a></a>').attr('href', nihLink).attr('target', '_blank').text(dbsnpId);
                $recordValue.append($nihLink);
            } else if (key === 'Gene') {
                let geneName = record[key];
                let geneCardLink = `https://www.genecards.org/cgi-bin/carddisp.pl?gene=${geneName}`;
                let $geneLink = $('<a></a>').attr('href', geneCardLink).attr('target', '_blank').text(geneName);
                $recordValue.append($geneLink);
            } else {
                $recordValue.text(record[key]);
            }

            $recordDetail.append($recordKey).append($recordValue);
            $topColumnsGrid.append($recordDetail);
        }
    });

    $container.append($topColumnsGrid);
}

function appendStudyParameters($container, records) {
    const studyParameters = ['Ethnicity', 'Geographical Origin', 'Country', 'Study Type', 'Effect Allele', 'Effect Allele Frequency', 'Effect/Beta (SE/CI)', 'Odds Ratio[CI]', 'Pvalue', 'Net Effect', 'Effect description', 'Description','Technique'];

    let studyParamValues = {};

    studyParameters.forEach(key => {
        records.forEach(record => {
            if (record.hasOwnProperty(key)) {
                if (!studyParamValues[key]) {
                    studyParamValues[key] = new Set();
                }
                studyParamValues[key].add(record[key]);
            }
        });
    });

    studyParameters.forEach(key => {
        if (studyParamValues[key] && studyParamValues[key].size > 0) {
            let values = Array.from(studyParamValues[key]);
            let $recordDetail = $('<div></div>').addClass('record-detail');
            let $recordKey = $('<div></div>').addClass('record-key').text(key + ':');
            let $recordValue = $('<div></div>').addClass('record-value');

            if (values.length === 1) {
                $recordValue.text(values[0]);
            } else {
                $recordValue.html(values.join(' | '));
            }

            $recordDetail.append($recordKey).append($recordValue);
            $container.append($recordDetail);
        }
    });
}

function fetchPublicationTitle(pmid, callback, retries = 3, delayMs = 1000) {
    const fetchTitle = (retryCount) => {
        $.ajax({
            url: `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id=${pmid}&retmode=json`,
            method: 'GET',
            success: function(response) {
                if (response.result && response.result[pmid] && response.result[pmid].title) {
                    const title = response.result[pmid].title;
                    callback(title);
                } else {
                    if (retryCount > 0) {
                        setTimeout(() => fetchTitle(retryCount - 1), delayMs);
                    } else {
                        callback('Unknown Publication');
                    }
                }
            },
            error: function() {
                if (retryCount > 0) {
                    setTimeout(() => fetchTitle(retryCount - 1), delayMs);
                } else {
                    callback('Unknown Publication');
                }
            }
        });
    };
    fetchTitle(retries);
}
        });
